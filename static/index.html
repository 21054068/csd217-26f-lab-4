<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Stock Info - Custom-Event Demo (Lit-HTML)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }

    .stock-tickers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .5rem;
    }
  </style>
  <script type="module">

    import './components/stock-info.js';

    let updating = false;
    let refreshRate = 1000;  // TODO: Fetch this from the server | kept it as a fallback
    let stocks = await tryFetchData('/data');
    let prices = await tryFetchData('/prices'); // holds the latest price for each symbol
    const rateData = await tryFetchData('/refreshRate'); //loads the servers current value when the page opens
    if (rateData) {
      refreshRate = rateData.refreshRate;
      document.querySelector('#refresh-rate').value = refreshRate;
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms))
    }

    // TODO: modify this function so it accepts and uses the options object to set HTTP method, headers, body, etc.
    //pass request options so the same helper can send GET, PUT, and DELETE.
    async function tryFetchData(path, options = {}) {
      try {
        let response = await fetch(path, options);
        if (response.ok) {
          return await response.json();
        } else {
          throw new Error("Could not find the data");
        }
      } catch (err) {
        console.log(err);
      }
    }

    async function validateInput(changeEvent) {
      const updatedValue = +(changeEvent.target.value);
      const min = 50;
      const max = 5000;
      if (!isNaN(updatedValue) && updatedValue <= max && updatedValue >= min) 
        {
        // TODO: use the PUT /refreshRate endpoint to update the refresh rate
      const rateData = await tryFetchData('/refreshRate', { //save the requested interval on the server as JSON.
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshRate: updatedValue })
      });

      if (rateData) {
        refreshRate = rateData.refreshRate; // Use the rate for both refreshing and the displayed input.
        changeEvent.target.value = refreshRate;
      }
        refreshRate = updatedValue;
      } else {
        const errorSpot = document.getElementById('input-errors');
        errorSpot.textContent = `Sorry, must be a number between ${min} and ${max}`
        setTimeout(() => {
          errorSpot.textContent = ''
        }, 1000);
        changeEvent.stopPropagation();
      }
    }

    // TODO: Replace this with SSE
    async function updatePrices() {
      while (updating) {

        const newPrices = await tryFetchData('/prices');

        for (let stock of stocks) {
          const newPrice = newPrices[stock.symbol];
          if (prices[stock.symbol] !== newPrice) {
            prices[stock.symbol] = newPrice;
            const payload = { stock: stock.symbol, value: newPrice };
            console.log(payload);
            const e = new CustomEvent('stock-update', { detail: payload });
            document.dispatchEvent(e);
          }
        }

        await delay(refreshRate);
      }
    }

    const tickersEl = document.querySelector('.stock-tickers');
    stocks.forEach(s => {
      // Create the stock-ticker element
      const el = document.createElement('stock-info');
      el.name = s.name;
      el.symbol = s.symbol;
      el.currentValue = prices[s.symbol];
      el.previousValue = prices[s.symbol];
      // Add it to the .stock-ticker div
      tickersEl.appendChild(el);
    });

let updateEvents;

function toggleUpdates() {
  const toggleBtn = document.getElementById('update-toggle');

  updating = !updating;

  if (updating) {
    toggleBtn.textContent = 'TOGGLE UPDATES 🟢';

    // Open a stream so the server can push changed prices.
    updateEvents = new EventSource('/prices/stream');

    updateEvents.addEventListener('price-update', function (event) {
      const updates = JSON.parse(event.data);

      // Forward each changed price to the Lit components as a stock-update event.
      for (const update of updates) {
        const stockEvent = new CustomEvent('stock-update', {
          detail: update
        });
        document.dispatchEvent(stockEvent);
      }
    });
  } else {
    toggleBtn.textContent = 'TOGGLE UPDATES 🔴';

    // Close the stream when the user stops updates.
    updateEvents.close();
  }
}

    document.getElementById("update-toggle").addEventListener('click', toggleUpdates);
    const refreshRateEl = document.querySelector('#refresh-rate');
    refreshRateEl.value = refreshRate;
    refreshRateEl.addEventListener('change', validateInput);
    document.getElementById('reset-refresh-rate')
    .addEventListener('click', async function () { // get the server to restore the default interval.
    const rateData = await tryFetchData('/refreshRate', {
      method: 'DELETE'
    });

    if (rateData) {
      refreshRate = rateData.refreshRate;
      refreshRateEl.value = refreshRate;
    }
  });
  </script>
</head>

<body>
  <h1>Stock Info - Custom Event Demo</h1>
  <button id="update-toggle">TOGGLE UPDATES 🔴</button>
  <button id="reset-refresh-rate" type="button">Reset</button>
  <label for="refresh-rate">Refresh Rate ( in ms )</label>
  <input id="refresh-rate" value="1000">
  <p id="input-errors"></p>
  <div class="stock-tickers">
  </div>
</body>

</html>
